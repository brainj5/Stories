<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chapterhouse</title>
  <meta name="description" content="Serial novels, released episode by episode. Read on your schedule, write on yours.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300..800&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Chapterhouse home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor"/><path d="M8 8h8M8 12h8M8 16h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Chapterhouse</span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/">Home</a>
      <a href="#/daily">Schedule</a>
      <a href="#/browse">Browse</a>
      <a href="#/studio" data-auth="in">Studio</a>
    </nav>
    <form class="search" role="search" id="searchForm">
      <label class="sr-only" for="searchInput">Search series</label>
      <input id="searchInput" type="search" placeholder="Search series, authors, tags" autocomplete="off">
    </form>
    <div class="account" id="accountMenu"></div>
  </header>

  <!-- Main container where stories from Supabase will render -->
  <main id="app" class="app" tabindex="-1">
    <div id="stories-container"></div>
  </main>

  <footer class="footer">
    <span>Chapterhouse prototype. Connected to Supabase.</span>
  </footer>

  <div class="toast-stack" id="toasts" aria-live="polite"></div>

  <!-- Supabase JavaScript SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Your custom application script -->
  <script src="app.js"></script>
</body>
</html>
